name: Sync, validate and deploy CS2 portal
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync.py'
      - '.github/workflows/sync.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cs2-sync-deploy
  cancel-in-progress: true
jobs:
  sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync data
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python scripts/sync.py
      - name: Build and validate
        env:
          SITE_BASE: https://campanhasupernow-rgb.github.io/sitescs
        run: |
          python scripts/build.py
          python scripts/validate.py
          node --check assets/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy synchronized portal
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Commit synchronized source data
        run: |
          git config user.name "cs2news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/site.json
          git diff --cached --quiet || git commit -m "chore: sync CS2 data"
          git push
